<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d9488">
    <title>Sin conexión · DENTAL-PRO</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0f172a; color: #e5e7eb; }
            .tarjeta { background: #1e293b; }
            p { color: #cbd5e1; }
        }
        .tarjeta {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(15, 23, 42, .08);
        }
        svg { width: 88px; height: 88px; }
        h1 { font-size: 1.4rem; margin: 20px 0 8px; }
        p { margin: 0 0 24px; line-height: 1.5; color: #4b5563; }
        button {
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: #0d9488;
            border: 0;
            border-radius: 10px;
            padding: 12px 28px;
            cursor: pointer;
        }
        button:hover { background: #0f766e; }
        small { display: block; margin-top: 20px; opacity: .6; }
    </style>
</head>
<body>
<main class="tarjeta">
    <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#0d9488"/>
        <path d="M16 7c-2 0-2.6.9-4.4.9C9.4 7.9 8 9.6 8 12.4c0 4.2 2.2 12.6 4.4 12.6 1.5 0 1.8-3.4 3.6-3.4s2.1 3.4 3.6 3.4c2.2 0 4.4-8.4 4.4-12.6 0-2.8-1.4-4.5-3.6-4.5-1.8 0-2.4-.9-4.4-.9z"
              fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <h1>Sin conexión</h1>
    <p>No se pudo conectar con DENTAL-PRO. Comprueba tu conexión a internet o a la red de la clínica y vuelve a intentarlo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
    <small>La página se recargará sola cuando vuelva la conexión.</small>
</main>
<script>
    window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
