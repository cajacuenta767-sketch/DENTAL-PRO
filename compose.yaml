name: odontosuite

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: odontosuite/app:latest
  restart: unless-stopped
  env_file:
    - .env
  environment:
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: "false"
    APP_URL: ${APP_URL:-http://localhost:8000}
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-odontosuite}
    DB_USERNAME: ${DB_USERNAME:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    QUEUE_CONNECTION: database
    SESSION_DRIVER: database
    CACHE_STORE: database
  volumes:
    - storage-data:/var/www/html/storage/app
    - storage-logs:/var/www/html/storage/logs
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app-base
    container_name: odontosuite-app
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-odontosuite}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  queue:
    <<: *app-base
    container_name: odontosuite-queue
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--max-time=3600"]
    user: www-data
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

  scheduler:
    <<: *app-base
    container_name: odontosuite-scheduler
    command: ["php", "artisan", "schedule:work"]
    user: www-data
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: odontosuite-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-odontosuite}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-odontosuite}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  storage-data:
  storage-logs:
