<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>DENTAL-PRO</title>
<style>
  :root { color-scheme: light; --verde: #0d9488; --texto: #1f2937; --gris: #6b7280; --fondo: #f3f6f8; --rojo: #b91c1c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--fondo); color: var(--texto); display: flex; flex-direction: column; -webkit-app-region: drag; user-select: none; overflow: hidden; }
  header { display: flex; align-items: center; gap: 14px; padding: 26px 32px 10px; }
  header svg { width: 56px; height: 56px; flex: none; }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .5px; }
  header p { margin: 2px 0 0; color: var(--gris); font-size: 13px; }
  main { flex: 1; padding: 6px 32px 24px; display: flex; flex-direction: column; gap: 14px; }
  #estado { font-size: 15px; min-height: 22px; }
  .barra { height: 8px; background: #d9e2e7; border-radius: 4px; overflow: hidden; }
  .barra > div { height: 100%; width: 0; background: var(--verde); border-radius: 4px; transition: width .4s ease; }
  .barra.animada > div { animation: pulso 1.2s ease-in-out infinite alternate; }
  @keyframes pulso { from { opacity: .55; } to { opacity: 1; } }
  #detalle { color: var(--gris); font-size: 12px; }
  #error { display: none; flex-direction: column; gap: 10px; flex: 1; min-height: 0; -webkit-app-region: no-drag; }
  #error h2 { margin: 0; color: var(--rojo); font-size: 17px; }
  #error p { margin: 0; font-size: 13px; white-space: pre-wrap; user-select: text; }
  #registro { flex: 1; min-height: 120px; margin: 0; padding: 10px; background: #111827; color: #e5e7eb; font: 11px/1.45 Consolas, "Cascadia Mono", monospace; border-radius: 6px; overflow: auto; white-space: pre-wrap; user-select: text; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; }
  button { -webkit-app-region: no-drag; font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; color: var(--texto); cursor: pointer; }
  button:hover { background: #f8fafc; }
  button.principal { background: var(--verde); border-color: var(--verde); color: #fff; }
  button.principal:hover { background: #0b7f75; }
  footer { padding: 0 32px 14px; font-size: 11px; color: var(--gris); display: flex; justify-content: space-between; }
  body.con-error main { gap: 10px; }
  body.con-error #progreso { display: none; }
  body.con-error #error { display: flex; }
</style>
</head>
<body>
  <header>
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#0d9488"/><path d="M16 7c-2 0-2.6.9-4.4.9C9.4 7.9 8 9.6 8 12.4c0 4.2 2.2 12.6 4.4 12.6 1.5 0 1.8-3.4 3.6-3.4s2.1 3.4 3.6 3.4c2.2 0 4.4-8.4 4.4-12.6 0-2.8-1.4-4.5-3.6-4.5-1.8 0-2.4-.9-4.4-.9z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
    <div>
      <h1>DENTAL-PRO</h1>
      <p>Gestión integral de la clínica dental</p>
    </div>
  </header>
  <main>
    <div id="progreso">
      <div id="estado">Iniciando…</div>
      <div class="barra animada" style="margin-top:12px"><div id="avance"></div></div>
      <div id="detalle" style="margin-top:8px">El primer arranque prepara la base de datos y puede tardar un par de minutos.</div>
    </div>
    <section id="error">
      <h2 id="error-titulo">No se pudo iniciar</h2>
      <p id="error-detalle"></p>
      <pre id="registro"></pre>
      <div class="acciones">
        <button class="principal" id="btn-reintentar">Reintentar</button>
        <button id="btn-registros">Ver registros</button>
        <button id="btn-datos">Abrir carpeta de datos</button>
        <button id="btn-salir">Salir</button>
      </div>
    </section>
  </main>
  <footer>
    <span id="version"></span>
    <span id="ruta"></span>
  </footer>
<script>
  (function () {
    const $ = (id) => document.getElementById(id);
    const puente = window.escritorio;
    if (!puente) { $('estado').textContent = 'Error interno: no hay puente con el proceso principal.'; return; }

    puente.info().then((i) => {
      $('version').textContent = 'Versión ' + i.version;
      $('ruta').textContent = i.rutaDatos;
    }).catch(() => {});

    puente.onProgreso((d) => {
      $('estado').textContent = d.texto;
      if (typeof d.porcentaje === 'number') {
        $('avance').style.width = Math.max(2, Math.min(100, d.porcentaje)) + '%';
      }
    });

    puente.onError((d) => {
      document.body.classList.add('con-error');
      $('error-titulo').textContent = d.titulo || 'No se pudo iniciar';
      $('error-detalle').textContent = (d.detalle || '') + '\n\nRegistros completos en: ' + (d.rutaLogs || '');
      $('registro').textContent = d.registro || '(sin registros todavía)';
      $('registro').scrollTop = $('registro').scrollHeight;
    });

    $('btn-reintentar').addEventListener('click', () => puente.reintentar());
    $('btn-registros').addEventListener('click', () => puente.abrirRegistros());
    $('btn-datos').addEventListener('click', () => puente.abrirCarpetaDatos());
    $('btn-salir').addEventListener('click', () => puente.salir());
  })();
</script>
</body>
</html>
